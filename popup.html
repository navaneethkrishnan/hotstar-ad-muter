<!doctype html><html><head><meta charset="utf-8"><title>Cricket Ad Muter</title><style>*{box-sizing:border-box}body{margin:0;width:320px;padding:18px;background:#0f172a;color:#e5e7eb;font:14px Arial,sans-serif}h2{margin:0 0 4px;font-size:18px}.sub{color:#94a3b8;font-size:11px;margin-bottom:16px}.card{background:#1e293b;border-radius:10px;padding:12px;margin-bottom:10px}.row{display:flex;align-items:center;justify-content:space-between}.status{font-weight:700}.dot{width:9px;height:9px;border-radius:50%;background:#22c55e;display:inline-block;margin-right:7px}label{display:block;color:#cbd5e1;margin:10px 0 6px}.range{width:100%}button{width:100%;border:0;border-radius:8px;padding:9px;background:#334155;color:white;cursor:pointer}small{display:block;color:#64748b;line-height:1.4;margin-top:12px}</style></head><body><h2>🏏 Cricket Ad Muter</h2><div class="sub">Unofficial extension for Hotstar</div><div class="card"><div class="row"><span>Status</span><span class="status"><span class="dot"></span>Ready</span></div></div><div class="card"><label>Ad-start correction: <b id="val">1.0</b> sec</label><input id="pad" class="range" type="range" min="0" max="5" step="0.5" value="1"><button id="save">Save setting</button></div><small>This extension only controls the browser tab's mute state. It does not block, skip, download, or modify ad video.</small><script src="popup.js"></script></body></html>
